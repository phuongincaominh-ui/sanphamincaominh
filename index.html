<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EEF0F3">
<title>Quản lý sản phẩm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#EEF0F3;
    --surface:#FFFFFF;
    --surface-alt:#F4F5F7;
    --ink:#15171B;
    --ink-soft:#6B7280;
    --ink-faint:#9CA3AF;
    --red:#E5342B;
    --red-dark:#C4271F;
    --red-tint:#FDECEB;
    --line:#EAEBEE;
    --line-strong:#DCDFE4;
    --white:#FFFFFF;
    --amber:#C98A00;
    --amber-dark:#8A5A00;
    --amber-tint:#FFF6E5;
    --shadow-sm:0 1px 2px rgba(20,20,25,.03), 0 4px 10px rgba(20,20,25,.04);
    --shadow-md:0 2px 8px rgba(20,20,25,.05), 0 14px 34px rgba(20,20,25,.08);
    --radius:14px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; }
  .app{ max-width:1280px; margin:0 auto; padding:22px 22px 70px; padding-bottom:calc(70px + env(safe-area-inset-bottom)); }
  button, .sp-card-img, .toggle-row, [tabindex]{ touch-action:manipulation; }

  .header{ display:flex; align-items:center; gap:14px; padding:14px 16px; margin-bottom:14px; position:relative; background:var(--surface); border-radius:20px; box-shadow:var(--shadow-sm); }
  .header .tagline{ font-family:'Inter', sans-serif; font-weight:800; letter-spacing:-0.01em; font-size:21px; color:var(--ink); line-height:1.1; }
  .user-bar{ margin-left:auto; display:flex; align-items:center; gap:10px; }
  .user-bar #currentUserLabel{ font-size:12.5px; font-weight:600; color:var(--ink-soft); font-family:'Inter', sans-serif; background:var(--surface-alt); padding:8px 13px; border-radius:100px; }

  .search-card{ padding:10px 12px; display:flex; align-items:center; gap:12px; }
  .search-input{ flex:1; display:flex; align-items:center; gap:10px; background:var(--surface-alt); border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 14px; transition:border-color .15s, box-shadow .15s, background .15s; }
  .search-input:focus-within{ border-color:var(--red); box-shadow:0 0 0 3px var(--red-tint); background:var(--surface); }
  .search-icon{ font-size:16px; color:var(--ink-faint); flex-shrink:0; }
  .search-input input{ border:none; outline:none; box-shadow:none; padding:0; font-family:'Inter', sans-serif; font-size:14px; font-weight:500; width:100%; background:transparent; color:var(--ink); }
  .search-input input::placeholder{ color:var(--ink-faint); }

  .login-error{ margin-top:12px; font-size:12.5px; color:var(--red-dark); background:var(--red-tint); padding:9px 12px; border-radius:var(--radius-sm); font-weight:600; }

  .card{ background:var(--surface); border:none; border-radius:20px; box-shadow:var(--shadow-sm); padding:18px; margin-bottom:14px; }
  .card h2{ font-family:'Inter', sans-serif; font-size:14px; font-weight:700; letter-spacing:-0.005em; color:var(--ink); margin:0 0 14px; display:flex; align-items:center; justify-content:space-between; gap:8px; }

  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:11.5px; font-weight:700; color:var(--ink-soft); }
  input, textarea, select{ font-family:'Inter', sans-serif; font-size:15px; font-weight:600; padding:11px 13px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface-alt); color:var(--ink); width:100%; transition:border-color .15s, box-shadow .15s, background .15s; }
  textarea{ font-weight:500; font-size:14px; resize:vertical; }
  input:focus, textarea:focus, select:focus{ outline:none; border-color:var(--red); box-shadow:0 0 0 3px var(--red-tint); background:var(--surface); }
  input::placeholder, textarea::placeholder{ color:var(--ink-faint); font-weight:500; }

  button{ font-family:'Inter', sans-serif; font-size:13.5px; font-weight:700; cursor:pointer; border:none; border-radius:var(--radius-sm); padding:11px 18px; transition:background .15s, color .15s, border-color .15s, transform .05s; }
  button:active{ transform:translateY(1px); }
  .btn-stamp{ background:var(--red); color:var(--white); box-shadow:0 2px 6px rgba(229,52,43,.28); }
  .btn-stamp:hover{ background:var(--red-dark); }
  .btn-ghost{ background:var(--white); color:var(--ink); border:1px solid var(--line); }
  .btn-ghost:hover{ background:var(--surface-alt); border-color:var(--ink-faint); }
  .btn-danger{ background:var(--white); color:var(--red); border:1px solid var(--line); padding:8px 13px; font-size:12px; }
  .btn-danger:hover{ background:var(--red); color:var(--white); border-color:var(--red); }
  .btn-small{ padding:8px 13px; font-size:12.5px; }

  .empty{ color:var(--ink-faint); font-size:13px; padding:40px 0; text-align:center; }

  /* ---------- LƯỚI SẢN PHẨM ---------- */
  .sp-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:14px; }
  .sp-card{ background:var(--surface); border-radius:16px; box-shadow:var(--shadow-sm); overflow:hidden; display:flex; flex-direction:column; position:relative; content-visibility:auto; contain-intrinsic-size:0 260px; }
  .sp-card-img{ width:100%; aspect-ratio:1/1; background:var(--surface-alt); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .sp-card-img img{ width:100%; height:100%; object-fit:contain; -webkit-touch-callout:none; }
  .sp-card-img .sp-noimg{ color:var(--ink-faint); font-size:12px; }
  .sp-card-body{ padding:12px 13px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .sp-card-name{ font-weight:700; font-size:14px; color:var(--ink); line-height:1.35; }
  .sp-card-note{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; white-space:pre-wrap; }
  .sp-hidden-badge{ position:absolute; top:9px; left:9px; font-size:10.5px; font-weight:700; color:var(--amber-dark); background:var(--amber-tint); padding:4px 9px; border-radius:100px; z-index:2; }
  .sp-card-actions{ display:flex; gap:6px; margin-top:auto; padding-top:6px; }
  .sp-card-actions button{ flex:1; padding:8px 6px; font-size:12px; }

  .sp-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .sp-count{ font-size:12.5px; color:var(--ink-soft); font-weight:600; }

  .kt-modal-overlay{ position:fixed; inset:0; background:rgba(20,20,25,.45); display:none; align-items:center; justify-content:center; z-index:1000; padding:20px; overscroll-behavior:contain; }
  .kt-modal-overlay.open{ display:flex; }
  .kt-modal{ background:var(--white); border-radius:20px; width:100%; max-width:460px; max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch; box-shadow:var(--shadow-md); overscroll-behavior:contain; }
  .kt-modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line); }
  .kt-modal-head h3{ margin:0; font-weight:800; font-size:16px; }
  .kt-modal-close{ background:none; border:none; font-size:20px; line-height:1; cursor:pointer; color:var(--ink-soft); }
  .kt-modal-body{ padding:18px 20px; display:flex; flex-direction:column; gap:14px; }
  .kt-modal-footer{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 20px; border-top:1px solid var(--line); }
  .kt-save-status{ font-size:11.5px; color:var(--ink-soft); font-weight:600; min-height:14px; }

  .toggle-row{ display:flex; align-items:flex-start; gap:9px; padding:11px 13px; background:var(--surface-alt); border-radius:var(--radius-sm); cursor:pointer; user-select:none; }
  .toggle-row input{ width:auto; margin:2px 0 0; accent-color:var(--red); flex-shrink:0; }
  .toggle-row-text{ font-size:12.5px; font-weight:600; color:var(--ink); line-height:1.5; }

  .img-dropzone{ display:flex; align-items:center; justify-content:center; gap:10px; min-height:140px; padding:12px; border:1.5px dashed var(--line-strong); border-radius:var(--radius-sm); background:var(--surface-alt); cursor:pointer; transition:border-color .15s, background .15s; text-align:center; position:relative; overflow:hidden; }
  .img-dropzone:hover, .img-dropzone:focus{ border-color:var(--red); background:var(--red-tint); outline:none; }
  .img-dropzone.dragover{ border-color:var(--red); background:var(--red-tint); }
  .img-dropzone-hint{ font-size:12.5px; color:var(--ink-soft); line-height:1.6; pointer-events:none; }
  .img-preview{ max-width:100%; max-height:220px; border-radius:var(--radius-sm); object-fit:contain; cursor:zoom-in; }

  .loading{ text-align:center; padding:80px 0; color:var(--ink-soft); font-weight:600; font-size:13px; }
  .loading .spinner{ width:26px; height:26px; margin:0 auto 14px; border:2.5px solid var(--line-strong); border-top-color:var(--red); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(6px); background:var(--ink); color:var(--white); padding:11px 20px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; box-shadow:var(--shadow-md); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:100; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- GIỎ HÀNG ---------- */
  .cart-fab{ position:fixed; right:20px; bottom:24px; bottom:calc(24px + env(safe-area-inset-bottom)); z-index:200; display:none; align-items:center; justify-content:center; gap:7px; background:var(--red); color:var(--white); border:none; border-radius:100px; padding:14px 20px; font-size:16px; font-weight:800; box-shadow:0 4px 14px rgba(229,52,43,.4); cursor:pointer; }
  .cart-fab:hover{ background:var(--red-dark); }
  .cart-line{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); }
  .cart-line:last-child{ border-bottom:none; }
  .cart-line-name{ font-weight:700; font-size:13.5px; color:var(--ink); line-height:1.4; }
  .cart-line-meta{ font-size:12px; color:var(--ink-soft); margin-top:3px; line-height:1.5; white-space:pre-wrap; }
  .cart-line-actions{ display:flex; gap:6px; flex-shrink:0; }

  /* ---------- PHÓNG TO ẢNH SẢN PHẨM ---------- */
  .sp-card-img img{ cursor:zoom-in; }
  .img-lightbox-overlay{ position:fixed; inset:0; background:rgba(10,10,12,.9); display:none; align-items:center; justify-content:center; z-index:1000; padding:24px; }
  .img-lightbox-overlay.open{ display:flex; }
  .img-lightbox-overlay img{ max-width:100%; max-height:100%; border-radius:12px; cursor:zoom-out; box-shadow:0 10px 40px rgba(0,0,0,.5); -webkit-touch-callout:none; }

  @media (max-width:520px){
    .app{ padding:16px 14px 60px; }
    .header .tagline{ font-size:18px; }
    .sp-grid{ grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
    /* input/textarea >=16px để iOS Safari không tự zoom khi bấm vào ô nhập */
    input, textarea, select{ font-size:16px; }
    button{ min-height:44px; }
    .sp-card-actions button{ min-height:38px; }
    .btn-small{ min-height:38px; }
  }
</style>
</head>

<script>

function spNormalizeSearch(str){
  return (str||'').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/đ/g,'d');
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- ẢNH: resize + nén trước khi lưu base64 vào Supabase ---------- */
function resizeImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 640;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const webp = canvas.toDataURL('image/webp', 0.75);
        const out = webp.startsWith('data:image/webp') ? webp : canvas.toDataURL('image/jpeg', 0.78);
        resolve(out);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- SẮP XẾP THEO MÃ SẢN PHẨM (TM-001, TM-002, ...) ---------- */
// Lấy mã nằm ở cuối tên, VD "Hộp bánh kem 20cm TM-001" -> { prefix:'TM', num:1 }
// Không có mã thì trả về null (sản phẩm đó sẽ nằm cuối danh sách)
function spProductCode(ten){
  const re = /\b([A-Za-z]+)\s*-\s*(\d+)\b/g;
  let m, last = null;
  while((m = re.exec(ten || '')) !== null) last = m;
  return last ? { prefix: last[1].toUpperCase(), num: parseInt(last[2], 10) } : null;
}
function spSortByCode(list){
  return list.slice().sort((a, b)=>{
    const ca = spProductCode(a.ten), cb = spProductCode(b.ten);
    if(ca && cb){
      if(ca.prefix !== cb.prefix) return ca.prefix < cb.prefix ? -1 : 1;
      return ca.num - cb.num; // so sánh theo SỐ, nên TM-2 < TM-10 < TM-100
    }
    if(ca) return -1;   // có mã đứng trước
    if(cb) return 1;
    return 0;           // cả hai không có mã: giữ nguyên thứ tự cũ (mới nhất trước)
  });
}

/* ---------- LOAD DỮ LIỆU ---------- */
async function loadAll(){
  try{
    const {data, error} = await sbClient.from('san_pham').select('id,ten,hinh_anh,ghi_chu,hien_thi_viewer').order('created_at', {ascending:false});
    if(error) throw error;
    spProducts = spSortByCode(data || []);
  }catch(e){
    spProducts = [];
    console.error('loadAll san_pham:', e);
    showToast('Lỗi tải danh sách sản phẩm. (Bảng san_pham đã được tạo trên Supabase chưa?)');
  }
}

/* ---------- RENDER LƯỚI SẢN PHẨM ---------- */
function spFilteredProducts(){
  const q = spNormalizeSearch(spSearchQuery.trim());
  const isAdmin = currentRole === 'editor';
  return spProducts.filter(p=>{
    if(!isAdmin && !p.hien_thi_viewer) return false;
    if(!q) return true;
    return spNormalizeSearch(p.ten).includes(q);
  });
}
function renderGrid(){
  const grid = document.getElementById('spGrid');
  const isAdmin = currentRole === 'editor';
  const list = spFilteredProducts();
  document.getElementById('spCount').textContent = list.length ? `${list.length} sản phẩm` : '';
  document.getElementById('spEmpty').style.display = list.length ? 'none' : 'block';
  grid.innerHTML = '';
  list.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'sp-card';
    const hiddenBadge = (isAdmin && !p.hien_thi_viewer) ? '<div class="sp-hidden-badge">Ẩn với viewer</div>' : '';
    const imgHtml = p.hinh_anh
      ? `<img src="${p.hinh_anh}" alt="" loading="lazy" decoding="async">`
      : `<span class="sp-noimg">Chưa có ảnh</span>`;
    const noteHtml = p.ghi_chu ? `<div class="sp-card-note">${escapeHtml(p.ghi_chu)}</div>` : '';
    const actionsHtml = `<div class="sp-card-actions">
        ${isAdmin ? `<button class="btn-ghost btn-small" data-edit="${p.id}">Sửa</button>` : ''}
        <button class="btn-stamp btn-small" data-order="${p.id}">Thêm vào đơn hàng</button>
      </div>`;
    card.innerHTML = `
      ${hiddenBadge}
      <div class="sp-card-img">${imgHtml}</div>
      <div class="sp-card-body">
        <div class="sp-card-name">${escapeHtml(p.ten)}</div>
        ${noteHtml}
        ${actionsHtml}
      </div>`;
    grid.appendChild(card);
  });
  grid.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=> openProductModal('edit', btn.getAttribute('data-edit')));
  });
  grid.querySelectorAll('[data-order]').forEach(btn=>{
    btn.addEventListener('click', ()=> openOrderModal(btn.getAttribute('data-order')));
  });
  grid.querySelectorAll('.sp-card-img img').forEach(img=>{
    img.addEventListener('click', ()=> openImgLightbox(img.src));
  });
}
function openImgLightbox(src){
  if(!src) return;
  document.getElementById('imgLightboxImg').src = src;
  document.getElementById('imgLightboxOverlay').classList.add('open');
}
function closeImgLightbox(){
  document.getElementById('imgLightboxOverlay').classList.remove('open');
  document.getElementById('imgLightboxImg').src = '';
}
document.getElementById('imgLightboxOverlay').addEventListener('click', closeImgLightbox);
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

let spSearchDebounce = null;
document.getElementById('spSearch').addEventListener('input', (e)=>{
  const val = e.target.value;
  clearTimeout(spSearchDebounce);
  spSearchDebounce = setTimeout(()=>{
    spSearchQuery = val;
    renderGrid();
  }, 150); // debounce nhẹ để gõ mượt, không render lại lưới mỗi ký tự
});

/* ---------- MODAL SẢN PHẨM ---------- */
function openProductModal(mode, id){
  const p = mode==='edit' ? spProducts.find(x=>x.id===id) : null;
  spModalCtx = { mode, id: p ? p.id : null, currentImage: p ? p.hinh_anh : null, removeImage:false };
  document.getElementById('spModalTitle').textContent = mode==='edit' ? 'Sửa sản phẩm' : 'Thêm sản phẩm';
  document.getElementById('spMName').value = p ? p.ten : '';
  document.getElementById('spMNote').value = p ? (p.ghi_chu||'') : '';
  document.getElementById('spMVisible').checked = p ? !!p.hien_thi_viewer : true;
  document.getElementById('spMDeleteBtn').style.display = mode==='edit' ? 'inline-block' : 'none';
  document.getElementById('spSaveStatus').textContent = '';
  renderSpImgPreview();
  document.getElementById('spModalOverlay').classList.add('open');
  setTimeout(()=> document.getElementById('spMName').focus(), 50);
}
function closeProductModal(){
  document.getElementById('spModalOverlay').classList.remove('open');
  spModalCtx = null;
}
function renderSpImgPreview(){
  const img = document.getElementById('spMImgPreview');
  const hint = document.getElementById('spImgDropzoneHint');
  const clearBtn = document.getElementById('spMClearImg');
  const show = spModalCtx && spModalCtx.currentImage && !spModalCtx.removeImage;
  img.style.display = show ? 'block' : 'none';
  hint.style.display = show ? 'none' : 'block';
  if(show) img.src = spModalCtx.currentImage;
  clearBtn.style.display = show ? 'inline-block' : 'none';
}
async function handleSpImageFile(file){
  if(!file || !file.type.startsWith('image/')) return;
  try{
    const dataUrl = await resizeImage(file);
    spModalCtx.currentImage = dataUrl;
    spModalCtx.removeImage = false;
    renderSpImgPreview();
  }catch(e){
    console.error('resize image:', e);
    showToast('Không đọc được ảnh này');
  }
}
const spDropzone = document.getElementById('spImgDropzone');
const spFileInput = document.getElementById('spMImgFile');
spDropzone.addEventListener('click', ()=> spFileInput.click());
spDropzone.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' ') spFileInput.click(); });
spFileInput.addEventListener('change', e=>{ if(e.target.files[0]) handleSpImageFile(e.target.files[0]); e.target.value=''; });
spDropzone.addEventListener('dragover', e=>{ e.preventDefault(); spDropzone.classList.add('dragover'); });
spDropzone.addEventListener('dragleave', ()=> spDropzone.classList.remove('dragover'));
spDropzone.addEventListener('drop', e=>{
  e.preventDefault(); spDropzone.classList.remove('dragover');
  if(e.dataTransfer.files[0]) handleSpImageFile(e.dataTransfer.files[0]);
});
// Ctrl+V dán ảnh ngay khi popup thêm/sửa sản phẩm đang mở, không cần bấm vào ô ảnh.
// Nếu clipboard là chữ (không có ảnh) thì bỏ qua, ô nhập tên/ghi chú vẫn dán chữ bình thường.
document.addEventListener('paste', e=>{
  if(!spModalCtx) return;
  const items = Array.from((e.clipboardData && e.clipboardData.items) || []);
  const item = items.find(i=>i.type.startsWith('image/'));
  if(!item) return;
  e.preventDefault();
  handleSpImageFile(item.getAsFile());
});
document.getElementById('spMImgPreview').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(spModalCtx && spModalCtx.currentImage) window.open(spModalCtx.currentImage, '_blank');
});
document.getElementById('spMClearImg').addEventListener('click', (e)=>{
  e.stopPropagation();
  spModalCtx.currentImage = null;
  spModalCtx.removeImage = true;
  renderSpImgPreview();
});

document.getElementById('btnAddProduct').addEventListener('click', ()=> openProductModal('new'));
document.getElementById('spModalCloseBtn').addEventListener('click', closeProductModal);
document.getElementById('spMCancelBtn').addEventListener('click', closeProductModal);

document.getElementById('spMSaveBtn').addEventListener('click', async ()=>{
  const ten = document.getElementById('spMName').value.trim();
  const statusEl = document.getElementById('spSaveStatus');
  if(!ten){ statusEl.textContent = 'Nhập tên sản phẩm.'; return; }
  const payload = {
    ten,
    ghi_chu: document.getElementById('spMNote').value.trim(),
    hien_thi_viewer: document.getElementById('spMVisible').checked,
  };
  if(spModalCtx.removeImage) payload.hinh_anh = null;
  else if(spModalCtx.currentImage) payload.hinh_anh = spModalCtx.currentImage;
  statusEl.textContent = 'Đang lưu...';
  try{
    if(spModalCtx.mode==='edit'){
      const {error} = await sbClient.from('san_pham').update(payload).eq('id', spModalCtx.id);
      if(error) throw error;
    } else {
      const {error} = await sbClient.from('san_pham').insert(payload);
      if(error) throw error;
    }
    await loadAll();
    renderGrid();
    closeProductModal();
    showToast('Đã lưu sản phẩm');
  }catch(e){
    console.error('save san_pham:', e);
    statusEl.textContent = 'Lỗi khi lưu. (Bảng san_pham đã được tạo trên Supabase chưa?)';
  }
});

document.getElementById('spMDeleteBtn').addEventListener('click', async ()=>{
  if(!spModalCtx || spModalCtx.mode!=='edit') return;
  if(!confirm('Xóa sản phẩm này?')) return;
  try{
    const {error} = await sbClient.from('san_pham').delete().eq('id', spModalCtx.id);
    if(error) throw error;
    await loadAll();
    renderGrid();
    closeProductModal();
    showToast('Đã xóa sản phẩm');
  }catch(e){
    console.error('delete san_pham:', e);
    document.getElementById('spSaveStatus').textContent = 'Lỗi khi xóa.';
  }
});

/* ---------- GIỎ HÀNG + GỬI ĐƠN QUA ZALO ---------- */
// TODO: thay bằng số điện thoại Zalo nhận đơn — định dạng: mã quốc gia 84 + số, bỏ số 0 đầu
// VD: số 0987 654 321  ->  '84987654321'
const ZALO_PHONE = '84368057001';

let cart = []; // { lineId, productId, ten, qty, note }
let cartLineSeq = 1;
let orderCtx = null; // { mode:'add'|'edit', productId, ten, lineId }

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}
async function copyToClipboard(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return;
    }
  }catch(e){ /* rơi xuống cách dự phòng */ }
  fallbackCopy(text);
}

/* ---- popup nhập số lượng + ghi chú (thêm mới hoặc sửa 1 dòng đã có) ---- */
function openOrderModal(id){
  const p = spProducts.find(x=>x.id===id);
  if(!p) return;
  orderCtx = { mode:'add', productId: p.id, ten: p.ten, lineId: null };
  document.getElementById('orderModalTitle').textContent = 'Thêm vào đơn hàng';
  document.getElementById('orderProductName').textContent = p.ten;
  document.getElementById('orderQty').value = 1;
  document.getElementById('orderNote').value = '';
  document.getElementById('orderSubmitBtn').textContent = 'Thêm';
  document.getElementById('orderModalOverlay').classList.add('open');
  setTimeout(()=> document.getElementById('orderQty').focus(), 50);
}
function openEditCartLine(lineId){
  const line = cart.find(l=>l.lineId===lineId);
  if(!line) return;
  orderCtx = { mode:'edit', productId: line.productId, ten: line.ten, lineId: line.lineId };
  document.getElementById('orderModalTitle').textContent = 'Sửa sản phẩm trong đơn';
  document.getElementById('orderProductName').textContent = line.ten;
  document.getElementById('orderQty').value = line.qty;
  document.getElementById('orderNote').value = line.note || '';
  document.getElementById('orderSubmitBtn').textContent = 'Cập nhật';
  document.getElementById('orderModalOverlay').classList.add('open');
  setTimeout(()=> document.getElementById('orderQty').focus(), 50);
}
function closeOrderModal(){
  document.getElementById('orderModalOverlay').classList.remove('open');
  orderCtx = null;
}
document.getElementById('orderModalCloseBtn').addEventListener('click', closeOrderModal);
document.getElementById('orderCancelBtn').addEventListener('click', closeOrderModal);
document.getElementById('orderSubmitBtn').addEventListener('click', ()=>{
  if(!orderCtx) return;
  const qty = (document.getElementById('orderQty').value || '1').trim();
  const note = document.getElementById('orderNote').value.trim();
  if(orderCtx.mode === 'edit'){
    const line = cart.find(l=>l.lineId===orderCtx.lineId);
    if(line){ line.qty = qty; line.note = note; }
    showToast('Đã cập nhật sản phẩm trong đơn hàng');
  } else {
    cart.push({ lineId: cartLineSeq++, productId: orderCtx.productId, ten: orderCtx.ten, qty, note });
    showToast('Đã thêm vào đơn hàng');
  }
  updateCartFab();
  renderCartList();
  closeOrderModal();
});

/* ---- icon giỏ hàng nổi + bảng xem lại đơn hàng ---- */
function updateCartFab(){
  const fab = document.getElementById('cartFab');
  if(!cart.length){
    fab.style.display = 'none';
    return;
  }
  fab.style.display = 'flex';
  document.getElementById('cartFabCount').textContent = cart.length;
}
function renderCartList(){
  const listEl = document.getElementById('cartList');
  const emptyEl = document.getElementById('cartEmpty');
  emptyEl.style.display = cart.length ? 'none' : 'block';
  listEl.innerHTML = '';
  cart.forEach(line=>{
    const div = document.createElement('div');
    div.className = 'cart-line';
    const metaText = `SL: ${line.qty}` + (line.note ? ` · ${line.note}` : '');
    div.innerHTML = `
      <div class="cart-line-info">
        <div class="cart-line-name">${escapeHtml(line.ten)}</div>
        <div class="cart-line-meta">${escapeHtml(metaText)}</div>
      </div>
      <div class="cart-line-actions">
        <button class="btn-ghost btn-small" data-cart-edit="${line.lineId}">Sửa</button>
        <button class="btn-danger btn-small" data-cart-del="${line.lineId}">Xóa</button>
      </div>`;
    listEl.appendChild(div);
  });
  listEl.querySelectorAll('[data-cart-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=> openEditCartLine(parseInt(btn.getAttribute('data-cart-edit'), 10)));
  });
  listEl.querySelectorAll('[data-cart-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const lineId = parseInt(btn.getAttribute('data-cart-del'), 10);
      cart = cart.filter(l=>l.lineId !== lineId);
      updateCartFab();
      renderCartList();
    });
  });
}
function openCartModal(){
  renderCartList();
  document.getElementById('cartModalOverlay').classList.add('open');
}
function closeCartModal(){
  document.getElementById('cartModalOverlay').classList.remove('open');
}
document.getElementById('cartFab').addEventListener('click', openCartModal);
document.getElementById('cartModalCloseBtn').addEventListener('click', closeCartModal);
document.getElementById('cartClearBtn').addEventListener('click', ()=>{
  if(!cart.length) return;
  if(!confirm('Xóa hết sản phẩm trong đơn hàng?')) return;
  cart = [];
  updateCartFab();
  renderCartList();
});
document.getElementById('cartSendBtn').addEventListener('click', async ()=>{
  if(!cart.length){ showToast('Chưa có sản phẩm nào trong đơn hàng'); return; }
  let msg = 'Đặt hàng:\n';
  cart.forEach((line, idx)=>{
    msg += `${idx+1}. ${line.ten} — SL: ${line.qty}`;
    if(line.note) msg += ` (Ghi chú: ${line.note})`;
    msg += '\n';
  });
  await copyToClipboard(msg.trim());
  showToast('Đã copy nội dung đơn — dán vào khung chat Zalo vừa mở (Ctrl+V hoặc giữ nhấn > Dán)');
  window.open(`https://zalo.me/${ZALO_PHONE}`, '_blank');
  cart = [];
  updateCartFab();
  closeCartModal();
});

/* ---------- AUTH (dùng chung app_users với các web khác) ---------- */
function openLoginModal(){
  document.getElementById('loginError').style.display = 'none';
  document.getElementById('loginUsername').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginModalOverlay').classList.add('open');
  setTimeout(()=> document.getElementById('loginUsername').focus(), 50);
}
function closeLoginModal(){
  document.getElementById('loginModalOverlay').classList.remove('open');
}
function updateAuthHeader(){
  const isLoggedIn = !!currentUser;
  const isAdmin = currentRole === 'editor';
  document.getElementById('btnShowLogin').style.display = isLoggedIn ? 'none' : 'inline-block';
  document.getElementById('currentUserLabel').style.display = isLoggedIn ? 'inline' : 'none';
  document.getElementById('btnLogout').style.display = isLoggedIn ? 'inline-block' : 'none';
  document.getElementById('btnAddProduct').style.display = isAdmin ? 'inline-block' : 'none';
}
async function afterLogin(user){
  currentUser = user;
  const {data, error} = await sbClient.from('app_users').select('username, role').eq('id', user.id).single();
  if(error || !data){
    console.error('load profile:', error);
    showToast('Tài khoản chưa được cấp quyền, liên hệ quản trị');
    currentUser = null;
    await sbClient.auth.signOut();
    updateAuthHeader();
    return;
  }
  currentRole = data.role;
  document.getElementById('currentUserLabel').textContent = data.username + (currentRole==='editor' ? ' · Toàn quyền' : ' · Chỉ xem');
  updateAuthHeader();
  renderGrid();
}
async function doLogin(){
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  if(!username || !password){ errEl.textContent = 'Nhập đầy đủ tài khoản và mật khẩu'; errEl.style.display = 'block'; return; }
  const btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.textContent = 'Đang đăng nhập...';
  const email = username.toLowerCase() + '@kho-gia.local';
  const {data, error} = await sbClient.auth.signInWithPassword({email, password});
  btn.disabled = false; btn.textContent = 'Đăng nhập';
  if(error){
    console.error('login error:', error);
    errEl.textContent = 'Sai tài khoản hoặc mật khẩu';
    errEl.style.display = 'block';
    return;
  }
  document.getElementById('loginPassword').value = '';
  await afterLogin(data.user);
  closeLoginModal();
}
document.getElementById('btnShowLogin').addEventListener('click', openLoginModal);
document.getElementById('loginModalCloseBtn').addEventListener('click', closeLoginModal);
document.getElementById('loginModalCancelBtn').addEventListener('click', closeLoginModal);
document.getElementById('btnLogin').addEventListener('click', doLogin);
document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('loginUsername').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('loginPassword').focus(); });
document.getElementById('btnLogout').addEventListener('click', async ()=>{
  await sbClient.auth.signOut();
  currentUser = null; currentRole = null;
  updateAuthHeader();
  renderGrid();
  showToast('Đã đăng xuất, chuyển sang chế độ chỉ xem');
});

/* ---------- INIT ---------- */
async function init(){
  document.getElementById('loading').style.display = 'block';
  currentRole = null;
  await loadAll();
  renderGrid();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';

  const {data:{session}} = await sbClient.auth.getSession();
  if(session && session.user){
    await afterLogin(session.user);
  } else {
    updateAuthHeader();
  }
}
init();
</script>
